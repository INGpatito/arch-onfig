# Boot-time visual login via Caelestia lockscreen
exec-once = sleep 2 && caelestia shell lock lock
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -

# ─── OMEN BlackArch System ────────────────────────────────────────────────────
# Super+XF86Launch2  → Activar/Desactivar modo BlackArch completo (con Ax-Shell)
# XF86Launch2        → Abrir shell interactiva dentro del sistema BlackArch
bind = Super, XF86Launch2, exec, foot --title "BlackArch Mode Toggle" --fullscreen ~/.local/bin/omen-blackarch-toggle.sh
bind = Super, XF86Launch1, exec, foot --title "BlackArch Mode Toggle" --fullscreen ~/.local/bin/omen-blackarch-toggle.sh
bind = , XF86Launch2, exec, foot --title "BlackArch Shell" ~/.local/bin/omen-blackarch-env.sh
bind = , XF86Launch1, exec, foot --title "BlackArch Shell" ~/.local/bin/omen-blackarch-env.sh

# Reglas de ventana para terminales BlackArch
windowrule = float true,    match:title BlackArch Mode Toggle
windowrule = size 900 600,  match:title BlackArch Mode Toggle
windowrule = center 1,      match:title BlackArch Mode Toggle
windowrule = float true,    match:title BlackArch Shell
windowrule = size 1200 700, match:title BlackArch Shell
windowrule = center 1,      match:title BlackArch Shell

windowrule = float true,    match:class scrcpy
windowrule = size 380 800,  match:class scrcpy
windowrule = center 1,      match:class scrcpy

# Proyectar teléfono con scrcpy (Smart USB/WiFi/Tailscale)
bind = SUPER ALT, KP_1, exec, ~/.local/bin/omen-scrcpy.sh
bind = SUPER ALT, KP_End, exec, ~/.local/bin/omen-scrcpy.sh

# Block de notas flotante (Mousepad)
bind = SUPER ALT, KP_2, exec, GDK_BACKEND=x11 mousepad --class=floating-notes
bind = SUPER ALT, KP_Down, exec, GDK_BACKEND=x11 mousepad --class=floating-notes

# Reglas para el block de notas flotante
windowrule = float true,    match:class floating-notes
windowrule = size 800 600,  match:class floating-notes
windowrule = center 1,      match:class floating-notes

# Calculadora flotante (Qalculate)
bind = , XF86Calculator, exec, qalculate-gtk

# Reglas para la calculadora flotante
windowrule = float true,    match:class qalculate-gtk
windowrule = size 380 550,  match:class qalculate-gtk
windowrule = center 1,      match:class qalculate-gtk

# Abrir Google Docs
bind = SUPER ALT, KP_3, exec, xdg-open "https://docs.google.com/document/"
bind = SUPER ALT, KP_Next, exec, xdg-open "https://docs.google.com/document/"
bind = SUPER ALT, KP_Page_Down, exec, xdg-open "https://docs.google.com/document/"

# Abrir Gentoo KVM (QEMU)
bind = SUPER ALT, KP_4, exec, /home/pato/gentoo-kvm/boot_system.sh
bind = SUPER ALT, KP_Left, exec, /home/pato/gentoo-kvm/boot_system.sh

# Abrir FreeBSD KVM (QEMU)
bind = SUPER ALT, 6, exec, /home/pato/freebsd-kvm/boot_system.sh
bind = SUPER ALT, KP_6, exec, /home/pato/freebsd-kvm/boot_system.sh
bind = SUPER ALT, KP_Right, exec, /home/pato/freebsd-kvm/boot_system.sh

# Crear/Encender/Apagar Hotspot Wifi
bind = SUPER ALT, KP_Decimal, exec, ~/.local/bin/omen-hotspot-toggle.sh
bind = SUPER ALT, KP_Delete, exec, ~/.local/bin/omen-hotspot-toggle.sh

# Abrir administrador de archivos Yazi
bind = SUPER, y, exec, foot -T "Yazi" /usr/bin/yazi

# Modo bajos recursos (Super + Alt + Numpad 0)
bind = SUPER ALT, KP_0, exec, ~/.local/bin/omen-low-resource-toggle.sh
bind = SUPER ALT, KP_Insert, exec, ~/.local/bin/omen-low-resource-toggle.sh
